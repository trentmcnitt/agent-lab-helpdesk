name: ci
on: [push, pull_request]

jobs:
  invariants:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # live trap tests skip if unset
      INVARIANT_K: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: bash scripts/ci.sh
