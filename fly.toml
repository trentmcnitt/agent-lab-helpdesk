# Fly.io config for the public demo. Not deployed; see DEPLOY.md.
# `fly launch --no-deploy --copy-config` picks this up; set `app` to your app name.
app = "agentlab-demo"
primary_region = "iad"

[build]

[env]
  DEMO_MODE = "replay"
  DEMO_TRUST_PROXY = "1"
  DEMO_SECURE_COOKIE = "1"
  DEMO_DAILY_USD = "1.00"
  DEMO_RATE_PER_MINUTE = "3"
  DEMO_RATE_PER_DAY = "20"
  DEMO_MAX_CONCURRENT = "4"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[mounts]
  source = "demo_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"   # "256mb" is enough while DEMO_MODE=replay
